[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varopt"
version = "0.1.0"
description = "A domain-agnostic optimization platform for dynamic systems."
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]